name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    # GitHub-hosted: org runner groups are not exposed to public repos, and
    # self-hosted runners must never execute fork PR code anyway.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    container: php:${{ matrix.php }}-cli-alpine
    steps:
      - uses: actions/checkout@v4
      - name: php -l all files
        run: |
          set -e
          find . -name '*.php' -print0 | while IFS= read -r -d '' f; do
            php -l "$f"
          done
      - name: Unit tests
        run: php tests/run.php
      - name: Shell syntax
        run: sh -n deploy/deploy.sh

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script syntax
        run: node --check modules/security/webauthn/webauthn.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
      - name: Run against the harness
        run: |
          php -v
          php -S localhost:8799 -t tests/harness >/tmp/harness.log 2>&1 &
          sleep 2
          node tests/e2e.mjs || { cat /tmp/harness.log; exit 1; }
